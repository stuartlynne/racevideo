Global:
  model_name: PP-OCRv5_mobile_rec
  debug: false
  use_gpu: true
  epoch_num: 2
  log_smooth_window: 20
  print_batch_step: 25
  save_model_dir: /home/sl/racevideo/data/training/din-v1-model
  save_epoch_step: 1
  eval_batch_step:
  - 0
  - 400
  cal_metric_during_train: true
  pretrained_model: /home/sl/racevideo/data/training/PP-OCRv5_mobile_rec_pretrained.pdparams
  checkpoints: null
  save_inference_dir: null
  use_visualdl: false
  infer_img: doc/imgs_words/ch/word_1.jpg
  character_dict_path: /home/sl/racevideo/data/training/PaddleOCR/ppocr/utils/dict/ppocrv5_dict.txt
  max_text_length: 25
  infer_mode: false
  use_space_char: true
  distributed: false
  save_res_path: ./output/rec/predicts_ppocrv5.txt
  d2s_train_image_shape:
  - 3
  - 48
  - 320
  use_amp: true
  amp_level: O1
  scale_loss: 1024
  seed: 20261105
Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 1.0e-05
    warmup_epoch: 0
  regularizer:
    name: L2
    factor: 3.0e-05
Architecture:
  model_type: rec
  algorithm: SVTR_LCNet
  Transform: null
  Backbone:
    name: PPLCNetV3
    scale: 0.95
  Head:
    name: MultiHead
    head_list:
    - CTCHead:
        Neck:
          name: svtr
          dims: 120
          depth: 2
          hidden_dims: 120
          kernel_size:
          - 1
          - 3
          use_guide: true
        Head:
          fc_decay: 1.0e-05
    - NRTRHead:
        nrtr_dim: 384
        max_text_length: 25
Loss:
  name: MultiLoss
  loss_config_list:
  - CTCLoss: null
  - NRTRLoss: null
PostProcess:
  name: CTCLabelDecode
Metric:
  name: RecMetric
  main_indicator: acc
Train:
  dataset:
    name: SimpleDataSet
    data_dir: /home/sl/racevideo/data/training/din-v1
    label_file_list:
    - /home/sl/racevideo/data/training/din-v1/train.txt
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - MultiLabelEncode:
        gtc_encode: NRTRLabelEncode
    - RecResizeImg:
        image_shape:
        - 3
        - 48
        - 320
    - KeepKeys:
        keep_keys:
        - image
        - label_ctc
        - label_gtc
        - length
        - valid_ratio
  loader:
    shuffle: true
    drop_last: true
    batch_size_per_card: 4
    num_workers: 0
Eval:
  dataset:
    name: SimpleDataSet
    data_dir: /home/sl/racevideo/data/training/din-v1
    label_file_list:
    - /home/sl/racevideo/data/training/din-v1/val.txt
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - MultiLabelEncode:
        gtc_encode: NRTRLabelEncode
    - RecResizeImg:
        image_shape:
        - 3
        - 48
        - 320
    - KeepKeys:
        keep_keys:
        - image
        - label_ctc
        - label_gtc
        - length
        - valid_ratio
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 4
    num_workers: 0
